name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          mypy hsp_dispatch_service

  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dispatch_db
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uapp -papp --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit test
        run: pytest tests/unit -q

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [lint, unit_test]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dispatch_db
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uapp -papp --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Coverage
        run: pytest --cov=hsp_dispatch_service --cov-report=term-missing --cov-fail-under=70 -q

  security_bandit:
    name: Security - Bandit
    runs-on: ubuntu-latest
    needs: [lint, unit_test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Security scan - bandit
        continue-on-error: true
        run: bandit -q -r hsp_dispatch_service

  security_pip_audit:
    name: Security - pip-audit
    runs-on: ubuntu-latest
    needs: [lint, unit_test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Security scan - pip-audit
        continue-on-error: true
        run: pip-audit

  security_trivy:
    name: Security - Trivy
    runs-on: ubuntu-latest
    needs: [lint, unit_test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve dependencies for Trivy
        run: |
          python -m venv /tmp/trivy-venv
          . /tmp/trivy-venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          mkdir -p .trivy
          pip freeze > .trivy/requirements.txt

      - name: Security scan - trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

  security_snyk_dependency:
    name: Security - Snyk Dependency
    runs-on: ubuntu-latest
    needs: [lint, unit_test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk dependency scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --severity-threshold=high --file=requirements-dev.txt --package-manager=pip

  build_image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - coverage
      - security_bandit
      - security_pip_audit
      - security_trivy
      - security_snyk_dependency

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"
          docker build -t "local/${REPO_NAME}:${GITHUB_SHA}" .

  scan_image:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    needs: build_image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"
          docker build -t "local/${REPO_NAME}:${GITHUB_SHA}" .

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk container scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"
          snyk container test "local/${REPO_NAME}:${GITHUB_SHA}" --severity-threshold=high

  push_image:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: scan_image
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"
          docker build -t "local/${REPO_NAME}:${GITHUB_SHA}" .

      - name: Login to Aliyun registry
        run: |
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login "${{ secrets.ALIYUN_REGISTRY }}" \
            --username "${{ secrets.ALIYUN_USERNAME }}" \
            --password-stdin

      - name: Push docker image to Aliyun
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"

          LOCAL_IMAGE="local/${REPO_NAME}:${GITHUB_SHA}"
          IMAGE_BASE="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${REPO_NAME}"
          IMAGE_SHA="${IMAGE_BASE}:${GITHUB_SHA}"
          IMAGE_LATEST="${IMAGE_BASE}:latest"

          docker tag "${LOCAL_IMAGE}" "${IMAGE_SHA}"
          docker tag "${LOCAL_IMAGE}" "${IMAGE_LATEST}"

          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_LATEST}"
